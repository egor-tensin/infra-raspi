[defaults]
inventory = inventory

# Prettier output.
callback_result_format = yaml

# Shut up already.
display_skipped_hosts = false
interpreter_python = auto_silent
host_key_checking = true

# This setting is experimental; the docs warn that it might clash with sudo.
pipelining = true

[ssh_connection]
retries = 2
ssh_extra_args = -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o ForwardAgent=yes
