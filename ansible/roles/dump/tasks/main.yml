- name: Gather facts
  ansible.builtin.setup:
    gather_subset: [user]

- name: Mount /mnt/dump
  become: true
  ansible.posix.mount:
    boot: true
    fstype: ntfs-3g
    opts: "uid={{ ansible_facts['user_uid'] }},gid={{ ansible_facts['user_gid'] }},dmask=002,fmask=113,async,noatime,big_writes,hide_hid_files,windows_names"
    passno: '2'
    path: /mnt/dump
    # The UUIDs were obtained using `blkid`.
    src: UUID=6218F9F018F9C2D9
    state: mounted

- name: Mount /mnt/external
  become: true
  ansible.posix.mount:
    boot: true
    fstype: ext4
    opts: defaults
    passno: '2'
    path: /mnt/external
    src: UUID=6c10451a-30ea-4fc9-ada8-c42c8c5f8efb
    state: mounted

- name: Fix Docker data directory
  become: true
  block:
    - name: Create override directory
      ansible.builtin.file:
        path: /etc/systemd/system/docker.service.d
        state: directory
        owner: root
        group: root
        mode: '755'

    - name: Create override file
      ansible.builtin.template:
        src: fix_data_dir.conf.j2
        dest: /etc/systemd/system/docker.service.d/fix_data_dir.conf
        owner: root
        group: root
        mode: '644'
      notify: docker_configured

    - name: Restart systemd service if necessary
      ansible.builtin.meta: flush_handlers

    - name: Remove the default Docker directory
      ansible.builtin.file:
        path: /var/lib/docker
        state: absent
