- name: General maintenance
  hosts: all
  gather_facts: false
  roles:
    - role: tensin.infra.debian_server
      vars:
        debian_server_unattended_upgrades: false
    - tensin.infra.wireguard
    - tensin.infra.docker
    - tensin.infra.my_dotfiles

- name: Set up the dump
  hosts: dump
  gather_facts: false
  roles:
    - role: tensin.infra.my_workspace
      vars:
        # Only clone until Docker is set up; this will make sure any volumes
        # are present when Docker's --data-dir is configured.
        my_workspace_clone_only: true
    - dump
    - role: tensin.infra.samba
      vars:
        samba_share_name: dump
        samba_share_dir: /mnt/dump
    - role: tensin.infra.nfs
      vars:
        nfs_dir: /mnt/dump
        nfs_all_squash: true

- name: Workspace
  hosts: all
  gather_facts: false
  roles:
    - tensin.infra.my_workspace
